# Freqtrade Base Configuration
# This file contains common settings shared across all deployments
# Override with environment-specific configs (e.g., canada_kraken.yaml)

# ============================================================
# EXCHANGE SETTINGS
# ============================================================
exchange:
  name: "kraken"
  # API credentials loaded from environment variables (Docker secrets)
  # api_key: "${FREQTRADE__EXCHANGE__API_KEY}"
  # secret: "${FREQTRADE__EXCHANGE__SECRET}"
  # CCXT configuration for rate limiting
  ccxt_config:
    enableRateLimit: true
  ccxt_async_config:
    enableRateLimit: true
    rateLimit: 3100  # Kraken requires ~3.1s between calls
  # Market types
  market_type: "spot"
  # Skip pairs with issues
  skip_pair_validation: false

# ============================================================
# TRADING SETTINGS
# ============================================================
# Stake currency - CAD for Kraken Canada
stake_currency: "CAD"
# Display profits in CAD
fiat_display_currency: "CAD"

# Dry-run mode (ALWAYS start with true)
dry_run: true
# Simulated starting wallet
dry_run_wallet: 1000

# Maximum open trades
max_open_trades: 3
# Stake amount per trade - "unlimited" uses tradable_balance_ratio
stake_amount: "unlimited"
# Ratio of total balance available for trading (0.90 = 90%)
tradable_balance_ratio: 0.90
# Reserve percentage for fees/slippage
amount_reserve_percent: 0.05

# Amend last stake amount if needed
amend_last_stake_amount: true
last_stake_amount_min_ratio: 0.5

# ============================================================
# RISK MANAGEMENT
# ============================================================
# Stoploss (8% for moderate risk)
stoploss: -0.08

# Trailing stoploss
trailing_stop: true
trailing_stop_positive: 0.02      # Start trailing at 2% profit
trailing_stop_positive_offset: 0.03  # Offset from stoploss
trailing_only_offset_is_reached: false

# Minimal ROI table (time in minutes -> profit ratio)
minimal_roi:
  "0": 0.04    # 4% immediate target
  "30": 0.02   # 2% after 30 minutes
  "60": 0.01   # 1% after 1 hour
  "120": 0     # Break-even after 2 hours

# ============================================================
# TIMEFRAME & CANDLE SETTINGS
# ============================================================
# Default timeframe (can be overridden by strategy)
timeframe: "5m"
# Process only new candles (more efficient)
process_only_new_candles: true

# ============================================================
# PAIR LIST SETTINGS
# ============================================================
pairlists:
  - method: "StaticPairList"
    config:
      # Pairs defined in environment-specific config
      # pairlist: []

# Blacklist pairs we don't want to trade
blacklist:
  # Stablecoin pairs (optional - enable in canada_kraken.yaml if desired)
  # - "USDC/CAD"
  # - "USDT/CAD"
  # Leveraged tokens
  - "*/BULL"
  - "*/BEAR"
  - "*/HALF"
  - "*/HEDGE"
  # Low volume / problematic pairs
  - "PEPE/CAD"

# ============================================================
# DATAPROVIDER SETTINGS
# ============================================================
dataprovider:
  # Use CCXT for data (same as exchange)
  dataformat_ohlcv: "json"
  dataformat_trades: "jsongz"
  # Candle history for backtesting
  candles_download:
    exchange: "kraken"
    dataformat: "json"
    days: 30

# ============================================================
# EDGE SETTINGS (Position Sizing Optimization)
# ============================================================
edge:
  enabled: true
  process_throttle_secs: 3600  # Recalculate hourly
  calculate_since_number_of_days: 30
  # Minimum trade history required
  minimum_trade_history: 10
  # Capital available for edge
  capital_available_percentage: 0.5
  # Stoploss range for optimization
  stoploss_range_min: -0.15
  stoploss_range_max: -0.03
  stoploss_range_step: 0.01

# ============================================================
# TELEGRAM SETTINGS (Optional)
# ============================================================
telegram:
  enabled: false
  # token: "${TELEGRAM_TOKEN}"
  # chat_id: "${TELEGRAM_CHAT_ID}"

# ============================================================
# DISCORD SETTINGS
# ============================================================
discord:
  enabled: true
  # webhook_url loaded from Docker secret
  # webhook_url: "${FREQTRADE__DISCORD__WEBHOOK_URL}"
  # Notification types
  notifications:
    trade_entry: true
    trade_exit: true
    trade_adjustment: true
    trade_failed: true
    status: true
    warning: true
    error: true
    startup: true
    shutdown: true

# ============================================================
# API SERVER (REST API for AI Orchestrator)
# ============================================================
api_server:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8080
  # Username/password from Docker secrets
  # username: "freqtrade"
  # password: "${FREQTRADE__API_SERVER__PASSWORD}"
  verbosity: "info"
  enable_openapi: true
  jwt_secret_key: "${FREQTRADE__CONFIG__ENCRYPT_KEY}"
  ws_token: "${FREQTRADE__CONFIG__ENCRYPT_KEY}"
  # CORS for AI Orchestrator
  cors_origins:
    - "http://localhost:8082"

# ============================================================
# WEB SERVER (FreqUI)
# ============================================================
webserver:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8081
  # Same auth as API server
  # username: "freqtrade"
  # password: "${FREQTRADE__API_SERVER__PASSWORD}"

# ============================================================
# DATABASE
# ============================================================
db_url: "sqlite:////freqtrade/user_data/data/tradesv3.sqlite"

# ============================================================
# LOGGING
# ============================================================
logging:
  logfile: "/freqtrade/user_data/logs/freqtrade.log"
  loglevel: "INFO"
  logfile_level: "DEBUG"
  syslog: false
  # Rotate logs
  logrotate: true
  logrotate_max_bytes: 10485760  # 10MB
  logrotate_backup_count: 10

# ============================================================
# STRATEGY SETTINGS
# ============================================================
strategy: "ModerateMultiPairStrategy"
strategy_path: "/freqtrade/user_data/strategies"

# ============================================================
# BACKTESTING SETTINGS
# ============================================================
backtesting:
  data_directory: "/freqtrade/user_data/data"
  export: "trades"
  export_filename: "backtest_result.json"

# ============================================================
# PLOTTING
# ============================================================
plot:
  enabled: true
  plotly: true
  main_plot:
    # Moving averages
    ema_9: {"color": "blue"}
    ema_21: {"color": "orange"}
    ema_50: {"color": "green"}
    ema_200: {"color": "red"}
    # Bollinger Bands
    bb_lowerband: {"color": "gray"}
    bb_middleband: {"color": "gray"}
    bb_upperband: {"color": "gray"}
  subplots:
    rsi:
      rsi: {"color": "purple"}
      rsi_overbought: {"color": "red"}
      rsi_oversold: {"color": "green"}
    macd:
      macd: {"color": "blue"}
      macdsignal: {"color": "orange"}
      macdhist: {"color": "green"}

# ============================================================
# DRY-RUN WALLET DETAILS
# ============================================================
dry_run_wallet:
  CAD: 1000

# ============================================================
# CANCEL ORDERS ON EXIT
# ============================================================
cancel_open_orders_on_exit: true

# ============================================================
# INTERNAL SETTINGS
# ============================================================
internals:
  process_throttle_secs: 5
  heartbeat_interval: 60