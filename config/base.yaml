# =============================================================================
# Freqtrade Base Configuration
# =============================================================================
# This file contains NO secrets. Credentials are injected at container start
# by /etc/freqtrade-entrypoint.sh, which reads the Docker Swarm secrets and
# generates an ephemeral private config in tmpfs (/dev/shm).
#
# DO NOT add api keys, passwords or webhook URLs to this file.
# =============================================================================

# -----------------------------------------------------------------------------
# EXCHANGE
# -----------------------------------------------------------------------------
exchange:
  name: "kraken"

  # Credentials come from the generated private config, never from this file.
  # key:    ""   <- provided at runtime
  # secret: ""   <- provided at runtime

  ccxt_config:
    enableRateLimit: true

  ccxt_async_config:
    enableRateLimit: true
    rateLimit: 3500          # Kraken requires ~3s between calls

  skip_pair_validation: false

  # StaticPairList reads the whitelist from here. Overridden in
  # canada_kraken.yaml with the CAD pairs.
  pair_whitelist:
    - "BTC/CAD"

  # Pair blacklist. Glob patterns are supported.
  pair_blacklist:
    - ".*/BULL"              # freqtrade blacklist entries are regexes
    - ".*/BEAR"
    - ".*/HALF"
    - ".*/HEDGE"
    - "PEPE/CAD"

# -----------------------------------------------------------------------------
# PAIRLIST HANDLER
# -----------------------------------------------------------------------------
pairlists:
  - method: "StaticPairList"

# -----------------------------------------------------------------------------
# STAKE / TRADING
# -----------------------------------------------------------------------------
stake_currency: "CAD"
fiat_display_currency: "CAD"

# ALWAYS start with dry_run: true
dry_run: true
dry_run_wallet: 1000         # simulated wallet, CAD

max_open_trades: 3
stake_amount: "unlimited"
tradable_balance_ratio: 0.90
amount_reserve_percent: 0.05

amend_last_stake_amount: true
last_stake_amount_min_ratio: 0.5

# -----------------------------------------------------------------------------
# RISK MANAGEMENT (moderate profile)
# -----------------------------------------------------------------------------
stoploss: -0.08

trailing_stop: true
trailing_stop_positive: 0.02
trailing_stop_positive_offset: 0.03
trailing_only_offset_is_reached: false

minimal_roi:
  "0": 0.04
  "30": 0.02
  "60": 0.01
  "120": 0

# Exchange-side stoploss (only takes effect when dry_run: false)
# stoploss_on_exchange: true
# stoploss_on_exchange_interval: 60

# -----------------------------------------------------------------------------
# TIMEFRAME
# -----------------------------------------------------------------------------
timeframe: "5m"
process_only_new_candles: true

# -----------------------------------------------------------------------------
# DATA STORAGE
# -----------------------------------------------------------------------------
dataformat_ohlcv: "json"
dataformat_trades: "jsongz"

# -----------------------------------------------------------------------------
# EDGE (position-sizing optimiser) - disabled until there is trade history
# -----------------------------------------------------------------------------
edge:
  enabled: false
  process_throttle_secs: 3600
  calculate_since_number_of_days: 30
  minimum_trade_history: 10
  capital_available_percentage: 0.5
  stoploss_range_min: -0.15
  stoploss_range_max: -0.03
  stoploss_range_step: 0.01

# -----------------------------------------------------------------------------
# TELEGRAM (disabled)
# -----------------------------------------------------------------------------
telegram:
  enabled: false

# -----------------------------------------------------------------------------
# DISCORD
# webhook_url is injected from the Swarm secret by the entrypoint.
# -----------------------------------------------------------------------------
discord:
  enabled: true
  entry_fill: true
  exit_fill: true
  entry_cancel: true
  exit_cancel: true
  protection_trigger: true
  protection_trigger_global: true
  status: true
  warning: true
  startup: true

# -----------------------------------------------------------------------------
# API SERVER (REST API used by the AI Orchestrator + serves FreqUI)
# username/password/jwt_secret_key/ws_token are injected from Swarm secrets.
# -----------------------------------------------------------------------------
api_server:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8080
  verbosity: "info"
  enable_openapi: true
  CORS_origins:
    - "http://localhost:8082"
    - "http://127.0.0.1:8082"

# -----------------------------------------------------------------------------
# WEBSERVER (FreqUI)
# -----------------------------------------------------------------------------
webserver:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8081
  verbosity: "info"

# -----------------------------------------------------------------------------
# DATABASE
# -----------------------------------------------------------------------------
db_url: "sqlite:////freqtrade/user_data/data/tradesv3.sqlite"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  logfile: "/freqtrade/user_data/logs/freqtrade.log"
  loglevel: "INFO"
  logfile_level: "DEBUG"
  syslog: false
  logrotate: true
  logrotate_max_bytes: 10485760
  logrotate_backup_count: 10

# -----------------------------------------------------------------------------
# STRATEGY
# The strategy file is mounted into /freqtrade/user_data via a Swarm config.
# -----------------------------------------------------------------------------
strategy: "ModerateMultiPairStrategy"
strategy_path: "/freqtrade/user_data"

# -----------------------------------------------------------------------------
# PLOTTING
# -----------------------------------------------------------------------------
plot:
  main_plot:
    ema_9: {color: "blue"}
    ema_21: {color: "orange"}
    ema_50: {color: "green"}
    ema_200: {color: "red"}
    bb_lowerband: {color: "gray"}
    bb_middleband: {color: "gray"}
    bb_upperband: {color: "gray"}
  subplots:
    rsi:
      rsi: {color: "purple"}
      rsi_overbought: {color: "red"}
      rsi_oversold: {color: "green"}
    macd:
      macd: {color: "blue"}
      macdsignal: {color: "orange"}
      macdhist: {color: "green"}

# -----------------------------------------------------------------------------
# OPERATIONAL
# -----------------------------------------------------------------------------
cancel_open_orders_on_exit: true

internals:
  process_throttle_secs: 5
