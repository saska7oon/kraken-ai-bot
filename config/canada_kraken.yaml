# =============================================================================
# Kraken Canada overrides
# =============================================================================
# Loaded AFTER base.yaml, so anything defined here wins.
# Contains NO secrets.
# =============================================================================

# -----------------------------------------------------------------------------
# EXCHANGE - KRAKEN CANADA
# -----------------------------------------------------------------------------
exchange:
  name: "kraken"
  ccxt_async_config:
    enableRateLimit: true
    rateLimit: 3500          # conservative: Kraken is strict

  # Kraken Canada (Kraken Canada Inc., Registered Restricted Dealer under the
  # OSC/CSA) offers SPOT only: no margin, no futures/derivatives, no xStocks.

  # StaticPairList whitelist - the only 4 crypto/CAD pairs Kraken Canada lists.
  pair_whitelist:
    - "BTC/CAD"              # XXBTZCAD
    - "ETH/CAD"              # XETHZCAD
    - "SOL/CAD"              # SOLCAD
    - "XRP/CAD"              # XXRPZCAD

  pair_blacklist:
    - "USDC/CAD"             # stablecoins: available, but not traded
    - "USDT/CAD"
    - "PEPE/CAD"             # memecoin, low quality
    - ".*/BULL"
    - ".*/BEAR"
    - ".*/HALF"
    - ".*/HEDGE"

# -----------------------------------------------------------------------------
# PAIRLIST
# -----------------------------------------------------------------------------
pairlists:
  - method: "StaticPairList"

# -----------------------------------------------------------------------------
# STAKE / DRY-RUN
# -----------------------------------------------------------------------------
stake_currency: "CAD"
fiat_display_currency: "CAD"
dry_run: true
dry_run_wallet: 1000

max_open_trades: 3
stake_amount: "unlimited"
tradable_balance_ratio: 0.90
amount_reserve_percent: 0.05

# -----------------------------------------------------------------------------
# RISK - MODERATE PROFILE
# -----------------------------------------------------------------------------
stoploss: -0.08

trailing_stop: true
trailing_stop_positive: 0.02
trailing_stop_positive_offset: 0.03
trailing_only_offset_is_reached: false

minimal_roi:
  "0": 0.04
  "30": 0.02
  "60": 0.01
  "120": 0

# -----------------------------------------------------------------------------
# STRATEGY
# -----------------------------------------------------------------------------
strategy: "ModerateMultiPairStrategy"

# -----------------------------------------------------------------------------
# API SERVER
# -----------------------------------------------------------------------------
api_server:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8080
  verbosity: "info"
  enable_openapi: true
  CORS_origins:
    - "http://localhost:8082"
    - "http://127.0.0.1:8082"

webserver:
  enabled: true
  listen_ip_address: "0.0.0.0"
  listen_port: 8081
  verbosity: "info"

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  logfile: "/freqtrade/user_data/logs/freqtrade.log"
  loglevel: "INFO"
  logfile_level: "DEBUG"
  syslog: false
  logrotate: true
  logrotate_max_bytes: 10485760
  logrotate_backup_count: 10

# =============================================================================
# NOTES
# =============================================================================
# REGULATORY: Kraken Canada Inc. is a Registered Restricted Dealer (OSC lead,
#   CSA members). Permitted: spot trading, Interac e-Transfer + wire funding.
#   Not permitted: margin, futures/derivatives, xStocks, most staking.
# TAX: all gains/losses are already denominated in CAD, which simplifies CRA
#   reporting.
# BACKTESTING: Kraken's REST API only returns ~720 historic candles. Use
#   `freqtrade download-data --dl-trades` for longer backtest history.
#
# Optional dynamic pair selection (do NOT enable together with the
# StaticPairList above):
#
# pairlists:
#   - method: "VolumePairList"
#     number_assets: 4
#     sort_key: "quoteVolume"
#     refresh_period: 1800
#     filters:
#       - method: "AgeFilter"
#         min_days: 30
