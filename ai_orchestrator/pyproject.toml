[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator"
version = "1.0.0"
description = "AI Orchestrator for Kraken Trading Bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "aiohttp==3.9.1",
    "aiofiles==23.2.1",
    "PyYAML==6.0.1",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

# The build context root must contain the `ai_orchestrator/` package directory.
# See ai_orchestrator/Dockerfile for the required build context.
[tool.setuptools.packages.find]
where = ["."]
include = ["ai_orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"