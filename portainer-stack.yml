version: '3.8'

# =============================================================================
# Kraken AI Bot - Docker Swarm stack
# =============================================================================
# Deploy via Portainer: Stacks -> Add stack -> Web editor -> paste this file.
#
# DESIGN NOTES
#
# 1. SECRETS: every credential is an EXTERNAL Swarm secret created in Portainer
#    (Secrets -> Add secret). They are mounted read-only at /run/secrets/<name>.
#    No secret ever appears in this file, in an environment variable, or in a
#    plaintext .env file.
#
# 2. CONFIGS: non-secret files (freqtrade config, strategy, entrypoint script,
#    AI orchestrator config) are EXTERNAL Swarm configs. Using Swarm configs
#    instead of bind mounts means:
#      - no absolute host paths are required (Portainer repository mode cannot
#        resolve relative bind paths, and Swarm never auto-creates a missing
#        bind-mount source directory)
#      - the files are distributed by the swarm itself
#
# 3. FREQTRADE CREDENTIALS: freqtrade does NOT support the "*_FILE" env-var
#    convention. Setting FREQTRADE__EXCHANGE__API_KEY_FILE=/run/secrets/... is
#    silently ignored - the key is never loaded. Instead the entrypoint config
#    (/etc/freqtrade-entrypoint.sh) reads the secret FILES and writes an
#    ephemeral private config to tmpfs (/dev/shm), which is passed to freqtrade
#    as the last --config. Secrets never touch disk or the environment.
#
# 4. The AI orchestrator never receives Kraken credentials - only the freqtrade
#    REST API URL and its password.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # FREQTRADE - trading engine (official image)
  # Also serves FreqUI on the api_server port.
  # ---------------------------------------------------------------------------
  freqtrade:
    image: freqtradeorg/freqtrade:stable

    # Override the image ENTRYPOINT so Swarm secrets are turned into the
    # freqtrade private config before the bot starts.
    entrypoint: ["/bin/bash", "/etc/freqtrade-entrypoint.sh"]
    command:
      - trade
      # NOTE: freqtrade parses every config file with rapidjson, regardless of
      # extension. There is no YAML support. These must be .json files.
      - --config
      - /freqtrade/user_data/base.json
      - --config
      - /freqtrade/user_data/canada_kraken.json
      - --config
      - /dev/shm/freqtrade-private.json
      - --strategy
      - ModerateMultiPairStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies

    configs:
      - source: freqtrade_base_config
        target: /freqtrade/user_data/base.json
      - source: freqtrade_canada_config
        target: /freqtrade/user_data/canada_kraken.json
      # Staged outside the strategies directory: Swarm configs are read-only, and
      # the entrypoint needs to be able to write AI-proposed strategies alongside
      # it. See the entrypoint's strategy-staging step.
      - source: freqtrade_strategy
        target: /etc/freqtrade-strategies/moderate_multi.py
      - source: freqtrade_entrypoint
        target: /etc/freqtrade-entrypoint.sh

    volumes:
      - freqtrade_data:/freqtrade/user_data/data
      - freqtrade_logs:/freqtrade/user_data/logs
      # Shared with the AI orchestrator so a generated strategy can actually be
      # backtested before the operator is asked to approve it.
      - strategies_shared:/freqtrade/user_data/strategies

    environment:
      - TZ=America/Toronto

    secrets:
      - kraken_api_key
      - kraken_api_secret
      - freqtrade_api_password
      - freqtrade_encrypt_key
      - discord_webhook

    networks:
      - botnet

    ports:
      # Host 8081 -> container api_server 8080 (REST API + FreqUI)
      - "8081:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 120s

  # ---------------------------------------------------------------------------
  # AI ORCHESTRATOR - FastAPI service, talks to freqtrade over the REST API.
  # Has NO Kraken credentials.
  # ---------------------------------------------------------------------------
  ai_orchestrator:
    image: ghcr.io/saska7oon/kraken-ai-orchestrator:latest

    configs:
      - source: freqtrade_ai_config
        target: /app/config/ai_orchestrator.yaml

    volumes:
      - ai_orchestrator_logs:/app/logs
      # Same volume freqtrade reads strategies from: this is what makes the
      # backtest gate possible.
      - strategies_shared:/app/strategies

    environment:
      - TZ=America/Toronto
      - FREQTRADE_API_URL=http://freqtrade:8080
      - FREQTRADE_API_USERNAME=freqtrade
      # CORS is an explicit allow-list. Leave empty if you only use curl or
      # Portainer; add origins only if you build a browser UI.
      - ORCHESTRATOR_CORS_ORIGINS=

    # main.py reads /run/secrets/<name> directly by name.
    secrets:
      - openrouter_api_key
      - freqtrade_api_password
      - discord_webhook
      # Bearer token for the orchestrator API. Without this secret the API
      # refuses every request rather than running open.
      - orchestrator_api_token

    networks:
      - botnet

    # Deliberately NOT published to the host.
    #
    # This port used to be published as "8082:8082", which exposed the
    # orchestrator - including its approval endpoint, which could apply changes -
    # to anything that could reach the host. It now talks only over the internal
    # swarm network. To reach it from your machine, tunnel it explicitly:
    #
    #   ssh -L 8082:localhost:8082 <pi-host>   # then port-forward inside swarm
    #
    # or run a one-off debug container attached to kraken-bot-network.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 120s

    depends_on:
      - freqtrade

  # ---------------------------------------------------------------------------
  # BACKUP SIDECAR - encrypted (age) backups of the freqtrade db/logs to
  # Nextcloud over WebDAV.
  # ---------------------------------------------------------------------------
  backup:
    image: ghcr.io/saska7oon/kraken-backup:latest

    volumes:
      - freqtrade_data:/data/freqtrade:ro
      - freqtrade_logs:/data/logs:ro
      - backup_temp:/tmp/backup

    environment:
      - TZ=America/Toronto
      - BACKUP_SCHEDULE=0 3 * * *
      - BACKUP_RETENTION_DAILY=30
      - BACKUP_RETENTION_MONTHLY=12

    secrets:
      - nextcloud_url
      - nextcloud_user
      - nextcloud_pass
      - backup_encrypt_key

    networks:
      - botnet

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 0
        window: 120s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  botnet:
    name: kraken-bot-network
    driver: overlay

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  freqtrade_data:
    name: kraken-freqtrade-data
  freqtrade_logs:
    name: kraken-freqtrade-logs
  ai_orchestrator_logs:
    name: kraken-ai-orchestrator-logs
  backup_temp:
    name: kraken-backup-temp
  # Strategies visible to both freqtrade (for backtesting) and the orchestrator
  # (for writing AI proposals). Both containers run as uid 1000, so ownership
  # is consistent.
  strategies_shared:
    name: kraken-strategies-shared

# =============================================================================
# CONFIGS - create these in Portainer: Configs -> Add config
# =============================================================================
#  freqtrade_base_config     <- config/base.json
#  freqtrade_canada_config   <- config/canada_kraken.json
#  freqtrade_strategy        <- config/strategies/moderate_multi.py
#  freqtrade_entrypoint      <- config/freqtrade-entrypoint.sh
#  freqtrade_ai_config       <- config/ai_orchestrator.yaml
# =============================================================================
configs:
  freqtrade_base_config:
    external: true
  freqtrade_canada_config:
    external: true
  freqtrade_strategy:
    external: true
  freqtrade_entrypoint:
    external: true
  freqtrade_ai_config:
    external: true

# =============================================================================
# SECRETS - create these in Portainer: Secrets -> Add secret
# =============================================================================
#  kraken_api_key
#  kraken_api_secret
#  openrouter_api_key
#  freqtrade_api_password
#  freqtrade_encrypt_key
#  discord_webhook
#  nextcloud_url
#  nextcloud_user
#  nextcloud_pass
#  backup_encrypt_key
#  orchestrator_api_token      <- required; the orchestrator API is locked without it
# =============================================================================
secrets:
  kraken_api_key:
    external: true
  kraken_api_secret:
    external: true
  openrouter_api_key:
    external: true
  freqtrade_api_password:
    external: true
  freqtrade_encrypt_key:
    external: true
  discord_webhook:
    external: true
  nextcloud_url:
    external: true
  nextcloud_user:
    external: true
  nextcloud_pass:
    external: true
  backup_encrypt_key:
    external: true
  orchestrator_api_token:
    external: true