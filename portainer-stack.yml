version: '3.8'

# Portainer Stack - External Secrets Version
# Deploy via: Portainer UI → Stacks → Add Stack
# Prerequisites: Create all secrets in Portainer UI first (see SECRETS.md)

services:
  # ============================================================
  # FREQTRADE - Core Trading Engine (Official Image)
  # ============================================================
  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: kraken-freqtrade
    restart: unless-stopped
    command: >
      trade
      --config /freqtrade/user_data/config/base.yaml
      --config /freqtrade/user_data/config/canada_kraken.yaml
      --strategy ModerateMultiPairStrategy
    volumes:
      - ./config:/freqtrade/user_data/config:ro
      - ./config/strategies:/freqtrade/user_data/strategies:ro
      - freqtrade_data:/freqtrade/user_data/data
      - freqtrade_logs:/freqtrade/user_data/logs
    environment:
      - FREQTRADE__EXCHANGE__API_KEY_FILE=/run/secrets/kraken_api_key
      - FREQTRADE__EXCHANGE__SECRET_FILE=/run/secrets/kraken_api_secret
      - FREQTRADE__API_SERVER__USERNAME=freqtrade
      - FREQTRADE__API_SERVER__PASSWORD_FILE=/run/secrets/freqtrade_api_password
      - FREQTRADE__CONFIG__ENCRYPT_KEY_FILE=/run/secrets/freqtrade_encrypt_key
      - FREQTRADE__DISCORD__WEBHOOK_URL_FILE=/run/secrets/discord_webhook
      - TZ=America/Toronto
    secrets:
      - kraken_api_key
      - kraken_api_secret
      - freqtrade_api_password
      - freqtrade_encrypt_key
      - discord_webhook
    networks:
      - botnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ============================================================
  # FREQUI - Web UI (Same Image, Different Command)
  # ============================================================
  freqtrade_ui:
    image: freqtradeorg/freqtrade:stable
    container_name: kraken-freqtrade-ui
    restart: unless-stopped
    command: >
      webserver
      --config /freqtrade/user_data/config/base.yaml
      --config /freqtrade/user_data/config/canada_kraken.yaml
    volumes:
      - ./config:/freqtrade/user_data/config:ro
      - ./config/strategies:/freqtrade/user_data/strategies:ro
      - freqtrade_data:/freqtrade/user_data/data
      - freqtrade_logs:/freqtrade/user_data/logs
    environment:
      - FREQTRADE__EXCHANGE__API_KEY_FILE=/run/secrets/kraken_api_key
      - FREQTRADE__EXCHANGE__SECRET_FILE=/run/secrets/kraken_api_secret
      - FREQTRADE__API_SERVER__USERNAME=freqtrade
      - FREQTRADE__API_SERVER__PASSWORD_FILE=/run/secrets/freqtrade_api_password
      - FREQTRADE__CONFIG__ENCRYPT_KEY_FILE=/run/secrets/freqtrade_encrypt_key
      - TZ=America/Toronto
    secrets:
      - kraken_api_key
      - kraken_api_secret
      - freqtrade_api_password
      - freqtrade_encrypt_key
    networks:
      - botnet
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ============================================================
  # AI ORCHESTRATOR - Custom Image (Built via CI/CD)
  # ============================================================
  ai_orchestrator:
    image: ${AI_ORCHESTRATOR_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER_LOWER}/kraken-ai-orchestrator:latest}
    container_name: kraken-ai-orchestrator
    restart: unless-stopped
    volumes:
      - ./config/ai_orchestrator.yaml:/app/config/ai_orchestrator.yaml:ro
      - ai_orchestrator_logs:/app/logs
    environment:
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_api_key
      - FREQTRADE_API_URL=http://freqtrade:8080
      - FREQTRADE_API_USERNAME=freqtrade
      - FREQTRADE_API_PASSWORD_FILE=/run/secrets/freqtrade_api_password
      - DISCORD_WEBHOOK_URL_FILE=/run/secrets/discord_webhook
      - TZ=America/Toronto
    secrets:
      - openrouter_api_key
      - freqtrade_api_password
      - discord_webhook
    networks:
      - botnet
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    depends_on:
      - freqtrade

  # ============================================================
  # BACKUP SIDECAR - Custom Image (Built via CI/CD)
  # ============================================================
  backup:
    image: ${BACKUP_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER_LOWER}/kraken-backup:latest}
    container_name: kraken-backup
    restart: unless-stopped
    volumes:
      - freqtrade_data:/data/freqtrade:ro
      - freqtrade_logs:/data/logs:ro
      - ./config:/data/config:ro
      - backup_temp:/tmp/backup
    environment:
      - NEXTCLOUD_URL_FILE=/run/secrets/nextcloud_url
      - NEXTCLOUD_USER_FILE=/run/secrets/nextcloud_user
      - NEXTCLOUD_PASS_FILE=/run/secrets/nextcloud_pass
      - BACKUP_ENCRYPT_KEY_FILE=/run/secrets/backup_encrypt_key
      - BACKUP_SCHEDULE=0 3 * * *
      - BACKUP_RETENTION_DAILY=30
      - BACKUP_RETENTION_MONTHLY=12
      - TZ=America/Toronto
    secrets:
      - nextcloud_url
      - nextcloud_user
      - nextcloud_pass
      - backup_encrypt_key
    networks:
      - botnet
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

# ============================================================
# NETWORKS
# ============================================================
networks:
  botnet:
    name: kraken-bot-network
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  freqtrade_data:
    name: kraken-freqtrade-data
  freqtrade_logs:
    name: kraken-freqtrade-logs
  ai_orchestrator_logs:
    name: kraken-ai-orchestrator-logs
  backup_temp:
    name: kraken-backup-temp

# ============================================================
# SECRETS (External - Created in Portainer UI)
# ============================================================
secrets:
  kraken_api_key:
    external: true
    name: kraken_api_key
  kraken_api_secret:
    external: true
    name: kraken_api_secret
  openrouter_api_key:
    external: true
    name: openrouter_api_key
  freqtrade_api_password:
    external: true
    name: freqtrade_api_password
  freqtrade_encrypt_key:
    external: true
    name: freqtrade_encrypt_key
  discord_webhook:
    external: true
    name: discord_webhook
  nextcloud_url:
    external: true
    name: nextcloud_url
  nextcloud_user:
    external: true
    name: nextcloud_user
  nextcloud_pass:
    external: true
    name: nextcloud_pass
  backup_encrypt_key:
    external: true
    name: backup_encrypt_key