version: '3.8'

# =============================================================================
# Kraken AI Bot - Docker Swarm stack
# =============================================================================
# Deploy via Portainer: Stacks -> Add stack -> Web editor -> paste this file.
#
# DESIGN NOTES
#
# 1. SECRETS: every credential is an EXTERNAL Swarm secret created in Portainer
#    (Secrets -> Add secret). They are mounted read-only at /run/secrets/<name>.
#    No secret ever appears in this file, in an environment variable, or in a
#    plaintext .env file.
#
# 2. CONFIGS: non-secret files (freqtrade config, strategy, entrypoint script,
#    AI orchestrator config) are EXTERNAL Swarm configs. Using Swarm configs
#    instead of bind mounts means:
#      - no absolute host paths are required (Portainer repository mode cannot
#        resolve relative bind paths, and Swarm never auto-creates a missing
#        bind-mount source directory)
#      - the files are distributed by the swarm itself
#
# 3. FREQTRADE CREDENTIALS: freqtrade does NOT support the "*_FILE" env-var
#    convention. Setting FREQTRADE__EXCHANGE__API_KEY_FILE=/run/secrets/... is
#    silently ignored - the key is never loaded. Instead the entrypoint config
#    (/etc/freqtrade-entrypoint.sh) reads the secret FILES and writes an
#    ephemeral private config to tmpfs (/dev/shm), which is passed to freqtrade
#    as the last --config. Secrets never touch disk or the environment.
#
# 4. The AI orchestrator never receives Kraken credentials - only the freqtrade
#    REST API URL and its password.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # FREQTRADE - trading engine (official image)
  # Also serves FreqUI on the api_server port.
  # ---------------------------------------------------------------------------
  freqtrade:
    # PINNED deliberately. Do not change this back to ':stable'.
    #
    # ':stable' is a floating tag. Freqtrade changes its config schema between
    # releases, and this project's configuration is validated against one exact
    # version. With ':stable', an unrelated redeploy can silently pull a newer
    # release whose schema rejects this config and stops the bot from starting -
    # exactly the kind of failure that is impossible to diagnose from the logs
    # unless you know the image moved underneath you.
    #
    # Everything here (config/base.json, config/freqtrade-entrypoint.sh and
    # tools/validate_against_schema.py) is verified against 2026.8. To upgrade,
    # change this tag, redeploy, and re-run:
    #
    #   python3 tools/validate_against_schema.py --freqtrade-src <that version>
    #
    # Do it as a deliberate step, not as a side effect of another change.
    image: freqtradeorg/freqtrade:2026.8

    # Override the image ENTRYPOINT so Swarm secrets are turned into the
    # freqtrade private config before the bot starts.
    entrypoint: ["/bin/bash", "/etc/freqtrade-entrypoint.sh"]
    command:
      - trade
      # NOTE: freqtrade parses every config file with rapidjson, regardless of
      # extension. There is no YAML support. These must be .json files.
      #
      # Kept OUTSIDE /freqtrade/user_data on purpose. Swarm configs are mounted
      # read-only, and freqtrade recursively chowns its user-data directory on
      # startup, which fails against read-only files and emits
      # "chown: ... Read-only file system" plus a "Could not chown" warning on
      # every start. Config files are not user data, so they live in /etc.
      - --config
      - /etc/freqtrade/base.json
      - --config
      - /etc/freqtrade/canada_kraken.json
      - --config
      - /dev/shm/freqtrade-private.json
      # LAST, so it wins. This is the file the operator's settings are written
      # to. Freqtrade merges configs in the order given, with later files taking
      # precedence, so anything in here overrides both Swarm configs.
      #
      # It is safe for this to be last even though the private config above is
      # generated for fail-safe reasons (disabling Discord when its secret is
      # missing): the orchestrator's settings allowlist has no key for discord,
      # the api_server block, the exchange block or any credential, so this file
      # can only ever contain the handful of trading settings the operator is
      # allowed to change. A test asserts that allowlist.
      #
      # If the file does not exist, freqtrade refuses to start. The entrypoint
      # creates it before freqtrade runs.
      - --config
      - /freqtrade/user_data/runtime/runtime_settings.json
      - --strategy
      - ModerateMultiPairStrategy
      - --strategy-path
      - /freqtrade/user_data/strategies

    configs:
      - source: freqtrade_base_config
        target: /etc/freqtrade/base.json
      - source: freqtrade_canada_config
        target: /etc/freqtrade/canada_kraken.json
      # Staged outside the strategies directory: Swarm configs are read-only, and
      # the entrypoint needs to be able to write AI-proposed strategies alongside
      # it. See the entrypoint's strategy-staging step.
      - source: freqtrade_strategy
        target: /etc/freqtrade-strategies/moderate_multi.py
      - source: freqtrade_entrypoint
        target: /etc/freqtrade-entrypoint.sh

    volumes:
      - freqtrade_data:/freqtrade/user_data/data
      - freqtrade_logs:/freqtrade/user_data/logs
      # Shared with the AI orchestrator so a generated strategy can actually be
      # backtested before the operator is asked to approve it.
      - strategies_shared:/freqtrade/user_data/strategies
      # The operator-editable settings layer. Swarm configs are immutable and
      # read-only, so anything the operator changes from the UI has to live in a
      # volume instead. Mounted at the same path in both containers, and read by
      # freqtrade as its LAST --config (see the command below), which is what
      # lets a UI change override the read-only configs.
      - settings_shared:/freqtrade/user_data/runtime

    environment:
      - TZ=America/Toronto

    secrets:
      - kraken_api_key
      - kraken_api_secret
      - freqtrade_api_password
      - freqtrade_encrypt_key
      - discord_webhook

    networks:
      - botnet

    ports:
      # Host 8081 -> container api_server 8080 (REST API + FreqUI)
      - "8081:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 120s

  # ---------------------------------------------------------------------------
  # AI ORCHESTRATOR - FastAPI service, talks to freqtrade over the REST API.
  # Has NO Kraken credentials.
  # ---------------------------------------------------------------------------
  ai_orchestrator:
    image: ghcr.io/saska7oon/kraken-ai-orchestrator:latest

    configs:
      - source: freqtrade_ai_config
        target: /app/config/ai_orchestrator.yaml

    volumes:
      - ai_orchestrator_logs:/app/logs
      # Same volume freqtrade reads strategies from: this is what makes the
      # backtest gate possible.
      - strategies_shared:/app/strategies
      # The one place the orchestrator can write configuration. It holds only
      # operator-chosen settings and the trade-list backups taken before a
      # dry-run reset - never a credential, which lives in Swarm secrets and is
      # not reachable from any route.
      - settings_shared:/app/settings

    environment:
      - TZ=America/Toronto
      - FREQTRADE_API_URL=http://freqtrade:8080
      - FREQTRADE_API_USERNAME=freqtrade
      # CORS is an explicit allow-list. Leave empty if you only use curl or
      # Portainer; add origins only if you build a browser UI.
      - ORCHESTRATOR_CORS_ORIGINS=

    # main.py reads /run/secrets/<name> directly by name.
    secrets:
      - openrouter_api_key
      - freqtrade_api_password
      - discord_webhook
      # Bearer token for the orchestrator API. Without this secret the API
      # refuses every request rather than running open.
      - orchestrator_api_token

    networks:
      - botnet

    # Published so the operator UI is reachable in a browser.
    #
    # This port was previously NOT published, because it exposed the approval
    # endpoint and that endpoint would apply a change list supplied in the
    # request body - so anyone who could reach the host could approve changes
    # that were never proposed. That specific hole is closed:
    #
    #   * every route except /health and / (the static UI page) requires the
    #     orchestrator_api_token bearer secret, and the service fails closed if
    #     that secret is missing;
    #   * /api/v1/approve requires a proposal_id that this process issued, is
    #     single-use, expires after 30 minutes, and is re-validated against the
    #     frozen-key and bounds rules before anything is applied;
    #   * the request body can no longer supply changes at all.
    #
    # The page served at / contains no secrets: the operator types the token into
    # the browser and it stays in that browser. Fetching the page grants nothing
    # that a curl user does not already have.
    #
    # Residual exposure, stated plainly: on a flat home network, anyone who can
    # reach this host sees a login page and can attempt the token. Treat the
    # token as the credential it is - long and random - and if the Pi is ever
    # reachable from outside your LAN, put it behind a VPN or reverse proxy with
    # TLS rather than relying on the token alone. To go back to tunnel-only
    # access, delete these two lines and use:
    #
    #   ssh -L 8082:localhost:8082 <pi-host>
    ports:
      - "8082:8082"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: any
        delay: 15s
        max_attempts: 0
        window: 120s

    depends_on:
      - freqtrade

  # ---------------------------------------------------------------------------
  # BACKUP SIDECAR - encrypted (age) backups of the freqtrade db/logs to
  # Nextcloud over WebDAV.
  # ---------------------------------------------------------------------------
  backup:
    image: ghcr.io/saska7oon/kraken-backup:latest

    volumes:
      - freqtrade_data:/data/freqtrade:ro
      - freqtrade_logs:/data/logs:ro
      - backup_temp:/tmp/backup

    environment:
      - TZ=America/Toronto
      - BACKUP_SCHEDULE=0 3 * * *
      - BACKUP_RETENTION_DAILY=30
      - BACKUP_RETENTION_MONTHLY=12

    secrets:
      - nextcloud_url
      - nextcloud_user
      - nextcloud_pass
      - backup_encrypt_key

    networks:
      - botnet

    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: any
        delay: 30s
        max_attempts: 0
        window: 120s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  botnet:
    name: kraken-bot-network
    driver: overlay

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  freqtrade_data:
    name: kraken-freqtrade-data
  freqtrade_logs:
    name: kraken-freqtrade-logs
  ai_orchestrator_logs:
    name: kraken-ai-orchestrator-logs
  backup_temp:
    name: kraken-backup-temp
  # Strategies visible to both freqtrade (for backtesting) and the orchestrator
  # (for writing AI proposals). Both containers run as uid 1000, so ownership
  # is consistent.
  strategies_shared:
    name: kraken-strategies-shared
  # Operator-editable settings, and the trade-list backups written before a
  # dry-run reset. Both containers run as uid 1000, so ownership is consistent.
  settings_shared:
    name: kraken-settings-shared

# =============================================================================
# CONFIGS - create these in Portainer: Configs -> Add config
# =============================================================================
#  freqtrade_base_config     <- config/base.json
#  freqtrade_canada_config   <- config/canada_kraken.json
#  freqtrade_strategy        <- config/strategies/moderate_multi.py
#  freqtrade_entrypoint      <- config/freqtrade-entrypoint.sh
#  freqtrade_ai_config       <- config/ai_orchestrator.yaml
# =============================================================================
configs:
  freqtrade_base_config:
    external: true
  freqtrade_canada_config:
    external: true
  freqtrade_strategy:
    external: true
  freqtrade_entrypoint:
    external: true
  freqtrade_ai_config:
    external: true

# =============================================================================
# SECRETS - create these in Portainer: Secrets -> Add secret
# =============================================================================
#  kraken_api_key
#  kraken_api_secret
#  openrouter_api_key
#  freqtrade_api_password
#  freqtrade_encrypt_key
#  discord_webhook
#  nextcloud_url
#  nextcloud_user
#  nextcloud_pass
#  backup_encrypt_key
#  orchestrator_api_token      <- required; the orchestrator API is locked without it
# =============================================================================
secrets:
  kraken_api_key:
    external: true
  kraken_api_secret:
    external: true
  openrouter_api_key:
    external: true
  freqtrade_api_password:
    external: true
  freqtrade_encrypt_key:
    external: true
  discord_webhook:
    external: true
  nextcloud_url:
    external: true
  nextcloud_user:
    external: true
  nextcloud_pass:
    external: true
  backup_encrypt_key:
    external: true
  orchestrator_api_token:
    external: true