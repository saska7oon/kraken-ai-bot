name: Build Custom Images

on:
  push:
    branches: [main]
    paths:
      - 'ai_orchestrator/**'
      - 'backup/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai_orchestrator/**'
      - 'backup/**'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., "v1.2.3")'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_ORCHESTRATOR: ${{ github.repository_owner }}/kraken-ai-orchestrator
  IMAGE_BACKUP: ${{ github.repository_owner }}/kraken-backup

jobs:
  # ==========================================================================
  # VALIDATION GATE
  # ==========================================================================
  # Runs before every build. Nothing is published if the configuration would
  # not start the bot, or if the strategy validator can be bypassed.
  #
  # This exists because the project has already shipped two fatal configuration
  # faults that only appeared at container start-up: a YAML config (Freqtrade
  # has no YAML support) and a `protections` key in the config (Freqtrade
  # 2026.x rejects it). Both were invisible until runtime. A failing check here
  # is far cheaper than a bot that will not boot.
  validate:
    name: Validate config and strategies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # The strategy execution test runs the real strategy file against a real
      # DataFrame. That needs pandas, and it is the whole point of the test: the
      # fatal `list | list` bug in populate_entry_trend was a pandas *type*
      # error that no amount of static checking would have found.
      - name: Install pandas (for the strategy execution test)
        run: python3 -m pip install --quiet pandas

      # The validator tests are pure stdlib, so they always run.
      #
      # Run plainly from the repo root. This step used to `cd ai_orchestrator/tests`
      # and put only `.` on sys.path, which made `import ai_orchestrator` fail.
      # That failed the whole validate job, and because build-orchestrator
      # declares `needs: validate`, the container image was never rebuilt: the
      # fix was in the repository but not in the running container. The visible
      # symptom was a deployed bot answering {"detail":"Not Found"} at /, because
      # the UI route existed in git but not in the image that was serving traffic.
      - name: Strategy safety validator (48 cases)
        run: python3 ai_orchestrator/tests/test_proposal_validator.py

      # Guard the class of bug, not just its instance. Every test here locates
      # the repo root from its own __file__; if one ever regresses to trusting
      # the caller's working directory, running the suite from elsewhere catches
      # it here rather than in a build that silently never happens.
      - name: Suite has no working-directory assumptions
        run: |
          set -euo pipefail
          for t in ai_orchestrator/tests/test_*.py; do
            (
              cd /tmp
              python3 "$GITHUB_WORKSPACE/$t"
            ) >/dev/null 2>&1 || {
              echo "::error file=$t::$t only passes from one working directory" \
                   "but the repository root must not be assumed"
              exit 1
            }
          done

      - name: Plugin scheduler (cron parsing)
        run: python3 ai_orchestrator/tests/test_plugin_scheduler.py

      - name: Operator UI (injection safety, endpoints, fields)
        run: python3 ai_orchestrator/tests/test_ui.py

      # The settings store and the dry-run reset are the first code here where
      # the operator's own actions change how the bot trades, so they get their
      # own suite: the allowlist, the derived db_url pairing, the typed
      # confirmation for going live, the refusal to reset a live bot, lock
      # clearing, failing closed when the bot cannot be reached, and the
      # assertion that the AI-facing surface cannot write settings at all.
      - name: Operator settings and dry-run reset
        run: python3 ai_orchestrator/tests/test_settings.py

      - name: Pair-list safety rules
        run: python3 ai_orchestrator/tests/test_pair_safety.py

      # The static rules above check the SHAPE of a pair (quote currency, not a
      # leveraged token). They cannot know whether the market exists, which is
      # how ADA/CAD reached a live whitelist: Kraken's /convert page shows a
      # converted price and is not an order book. This asks the exchange.
      # Skips loudly if Kraken is unreachable rather than passing silently.
      - name: Configured pairs are real Kraken markets
        run: python3 tools/check_pairs_against_kraken.py

      # Runs the shipped strategy against a real DataFrame. This is the check
      # that would have caught the entry-signal crash before it reached a live
      # bot; static validation cannot see a runtime type error.
      - name: Strategy actually executes and produces signals
        run: python3 ai_orchestrator/tests/test_strategy_runs.py

      # Runs the page's own renderBotControls() against a stub DOM, so the
      # question "does a running bot also offer Start?" is answered by executing
      # the function rather than by pattern-matching its source. Node ships on
      # the runner; the test skips with a clear message if it is ever absent
      # rather than becoming a reason the build cannot run.
      - name: Bot control panel offers only sensible actions
        run: python3 ai_orchestrator/tests/test_bot_controls.py

      # This one runs the real send() against a stub DOM rather than calling the
      # renderer directly. The first version of it did the latter and passed even
      # with the fix reverted, because what was missing was the call site - a
      # renderer that nothing calls is precisely the bug being guarded.
      - name: The chat displays what the server returns
        run: python3 ai_orchestrator/tests/test_chat_rendering.py

      - name: Strategy naming
        run: python3 ai_orchestrator/tests/test_strategy_naming.py

      # Two ways to pick a risk level (the panel and the assistant) had drifted
      # to seven contradictory values. Nothing compared them until this.
      - name: A risk level means one thing
        run: python3 ai_orchestrator/tests/test_risk_levels.py

      # A strategy change with positions open must queue, not apply: a new
      # strategy taking over the exits of trades it never opened is a decision
      # nobody made.
      - name: Strategy changes wait for open positions
        run: python3 ai_orchestrator/tests/test_strategy_switch.py

      # A wrong fee produces no error, just flattering numbers. Nothing else
      # checks that simulation is charged what Kraken actually charges.
      - name: Simulated trading is charged the real fee
        run: python3 ai_orchestrator/tests/test_fees.py

      # The timeframe, the ROI ladder (minutes) and the protections (candles)
      # use three different units. Changing one silently reinterprets the others,
      # with no error and no log line.
      - name: The three time units agree
        run: python3 ai_orchestrator/tests/test_timeframe_units.py

      - name: Configuration preflight
        run: python3 tools/preflight_config.py

      # Fetch the exact Freqtrade source this project targets and validate the
      # merged configuration against its OWN JSON schema - not a copy of it.
      - name: Fetch Freqtrade 2026.8 for its real schema
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/ft.tar.gz \
            https://github.com/freqtrade/freqtrade/archive/refs/tags/2026.8.tar.gz
          mkdir -p /tmp/ftsrc
          tar -xzf /tmp/ft.tar.gz -C /tmp/ftsrc --strip-components=1

      - name: Validate config against Freqtrade's real schema
        run: |
          python3 tools/validate_against_schema.py --freqtrade-src /tmp/ftsrc

      # Nothing in our own suite can tell whether /api/v1/locks/{id} is a real
      # route or takes DELETE. A wrong one is not a crash - it is a 404 that our
      # client turns into "could not reach the bot", which for an operator who
      # cannot read the logs looks identical to a feature that is simply idle.
      - name: Check every Freqtrade API call against the real routes
        run: |
          python3 tools/audit_api_routes.py --freqtrade-src /tmp/ftsrc

  build-orchestrator:
    name: Build AI Orchestrator
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Orchestrator
        id: meta-orchestrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORCHESTRATOR }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ github.event.inputs.tag_suffix && format('type=raw,value={0}', github.event.inputs.tag_suffix) || '' }}

      - name: Build and push AI Orchestrator
        id: build-orchestrator
        uses: docker/build-push-action@v5
        with:
          # Context MUST be the repo root so the `ai_orchestrator/` package
          # lands at /app/ai_orchestrator inside the image.
          context: .
          file: ai_orchestrator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_ORCHESTRATOR }}
          subject-digest: ${{ steps.build-orchestrator.outputs.digest }}
          push-to-registry: true

  build-backup:
    name: Build Backup Sidecar
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backup
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKUP }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ github.event.inputs.tag_suffix && format('type=raw,value={0}', github.event.inputs.tag_suffix) || '' }}

      - name: Build and push Backup Sidecar
        id: build-backup
        uses: docker/build-push-action@v5
        with:
          context: ./backup
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKUP }}
          subject-digest: ${{ steps.build-backup.outputs.digest }}
          push-to-registry: true

  # Optional: Notify Portainer to update stack
  # Requires: Portainer API endpoint + token in repository secrets
  notify-portainer:
    name: Notify Portainer (Optional)
    needs: [build-orchestrator, build-backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Portainer config
        run: |
          if [ -z "${{ secrets.PORTAINER_API_URL }}" ] || [ -z "${{ secrets.PORTAINER_API_TOKEN }}" ]; then
            echo "Portainer credentials not configured - skipping notification"
            exit 0
          fi
          echo "Portainer configured - would trigger stack update here"
        shell: bash

      # Example Portainer API call (uncomment and configure if needed):
      # - name: Trigger Portainer Stack Update
      #   run: |
      #     curl -X POST "${{ secrets.PORTAINER_API_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}/webhook" \
      #       -H "Authorization: Bearer ${{ secrets.PORTAINER_API_TOKEN }}"