name: Build Custom Images

on:
  push:
    branches: [main]
    paths:
      - 'ai_orchestrator/**'
      - 'backup/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai_orchestrator/**'
      - 'backup/**'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Optional tag suffix (e.g., "v1.2.3")'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_ORCHESTRATOR: ${{ github.repository_owner }}/kraken-ai-orchestrator
  IMAGE_BACKUP: ${{ github.repository_owner }}/kraken-backup

jobs:
  build-orchestrator:
    name: Build AI Orchestrator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Orchestrator
        id: meta-orchestrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORCHESTRATOR }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ github.event.inputs.tag_suffix && format('type=raw,value={0}', github.event.inputs.tag_suffix) || '' }}

      - name: Build and push AI Orchestrator
        id: build-orchestrator
        uses: docker/build-push-action@v5
        with:
          # Context MUST be the repo root so the `ai_orchestrator/` package
          # lands at /app/ai_orchestrator inside the image.
          context: .
          file: ai_orchestrator/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_ORCHESTRATOR }}
          subject-digest: ${{ steps.build-orchestrator.outputs.digest }}
          push-to-registry: true

  build-backup:
    name: Build Backup Sidecar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backup
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKUP }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            ${{ github.event.inputs.tag_suffix && format('type=raw,value={0}', github.event.inputs.tag_suffix) || '' }}

      - name: Build and push Backup Sidecar
        id: build-backup
        uses: docker/build-push-action@v5
        with:
          context: ./backup
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Generate attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKUP }}
          subject-digest: ${{ steps.build-backup.outputs.digest }}
          push-to-registry: true

  # Optional: Notify Portainer to update stack
  # Requires: Portainer API endpoint + token in repository secrets
  notify-portainer:
    name: Notify Portainer (Optional)
    needs: [build-orchestrator, build-backup]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Portainer config
        run: |
          if [ -z "${{ secrets.PORTAINER_API_URL }}" ] || [ -z "${{ secrets.PORTAINER_API_TOKEN }}" ]; then
            echo "Portainer credentials not configured - skipping notification"
            exit 0
          fi
          echo "Portainer configured - would trigger stack update here"
        shell: bash

      # Example Portainer API call (uncomment and configure if needed):
      # - name: Trigger Portainer Stack Update
      #   run: |
      #     curl -X POST "${{ secrets.PORTAINER_API_URL }}/api/stacks/${{ secrets.PORTAINER_STACK_ID }}/webhook" \
      #       -H "Authorization: Bearer ${{ secrets.PORTAINER_API_TOKEN }}"